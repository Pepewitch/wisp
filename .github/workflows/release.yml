name: release

# Publishing is tag-driven, never merge-driven. The release preparation PR
# (skills/wisp-dev/references/releasing.md) lands the synchronized version and
# release notes on main; pushing the annotated `v<version>` tag is the maintainer's
# explicit publish authorization. Immutable asset publication and mutable
# channel promotion are separate jobs, so a failed promotion can be rerun
# without rebuilding or mutating a release. workflow_dispatch is recovery-only:
# it accepts an existing public tag and runs the promotion job by itself.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing public annotated release tag to promote
        required: true
        type: string

concurrency:
  group: wisp-release
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

# Least privilege by default: a job that needs more says so itself, so a new
# job cannot inherit release or publication rights by being added here.
permissions:
  contents: read

jobs:
  # This credential-free gate owns source identity, history scanning, and the
  # canonical UI bytes. Every platform build starts only after it succeeds.
  release-source:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      checks: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history for Gitleaks and --require-tag
          fetch-tags: true
      # checkout resolves a tag event to github.sha and can leave the local
      # tag ref lightweight. Restore the actual remote tag object so the
      # release scripts can prove that the maintainer pushed an annotated tag.
      - name: restore and verify the annotated release tag
        run: |
          git fetch --force origin \
            "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          test "$(git cat-file -t "refs/tags/$GITHUB_REF_NAME")" = tag
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile

      # releasing.md: never tag an unmerged branch.
      - name: require the tag to point at main
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "tag $GITHUB_REF_NAME does not point at a commit on origin/main" >&2
            exit 1
          }

      # The candidate workflow exercises this exact main commit through the
      # installer and activation containers before publication is allowed. A
      # short poll handles a tag pushed while the main check is still running.
      - name: require the exact commit's release candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 90); do
            all_succeeded=1
            for check_name in linux-contract update-verifier; do
              state="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs" \
                --jq "[.check_runs[] |
                  select(.name == \"$check_name\" and .app.slug == \"github-actions\")] |
                  sort_by(.started_at) | last |
                  if . == null then \"missing\" else \"\\(.status):\\(.conclusion // \"\")\" end")"
              case "$state" in
                completed:success) ;;
                completed:*)
                  echo "release-candidate/$check_name failed for $GITHUB_SHA: $state" >&2
                  exit 1
                  ;;
                *) all_succeeded=0 ;;
              esac
            done
            if [ "$all_succeeded" = 1 ]; then
              break
            fi
            if [ "$attempt" = 90 ]; then
              echo "release candidate did not pass for $GITHUB_SHA within 15 minutes" >&2
              exit 1
            fi
            sleep 10
          done

      # releasing.md step 5: scan full history before building anything.
      - name: scan history with Gitleaks
        run: |
          docker run --rm --platform linux/amd64 \
            --mount "type=bind,source=$PWD,target=$PWD,readonly" \
            zricethezav/gitleaks@sha256:cdbb7c955abce02001a9f6c9f602fb195b7fadc1e812065883f695d1eeaba854 git "$PWD" \
            --gitleaks-ignore-path "$PWD/.gitleaksignore" \
            --redact

      # Build the ignored UI once from the exact tag. The macOS job downloads
      # these bytes rather than generating an independent Desktop frontend.
      - name: build and reproduce the shared UI bundle
        run: |
          stage="$RUNNER_TEMP/release-ui"
          mkdir -p "$stage"
          bun run build:ui
          cp web/ui-dist/index.html "$stage/index.html"
          bun run build:ui
          cmp -s "$stage/index.html" web/ui-dist/index.html || {
            echo "non-reproducible UI bundle" >&2
            exit 1
          }
          (cd "$stage" && sha256sum index.html > SHA256SUMS)
      - name: stage the shared UI bundle for macOS packaging
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: canonical-ui-bundle
          path: |
            ${{ runner.temp }}/release-ui/index.html
            ${{ runner.temp }}/release-ui/SHA256SUMS
          retention-days: 7
          if-no-files-found: error

  # Linux and all three macOS builds fan out after the source gate. This keeps
  # the same checks while removing their old serial critical path.
  release-linux:
    needs: release-source
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: restore and verify the annotated release tag
        run: |
          git fetch --force origin \
            "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          test "$(git cat-file -t "refs/tags/$GITHUB_REF_NAME")" = tag
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: collect and verify the shared UI bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: canonical-ui-bundle
          path: ${{ runner.temp }}/release-ui
      - name: install the shared UI bundle
        run: |
          (cd "$RUNNER_TEMP/release-ui" && sha256sum -c SHA256SUMS)
          mkdir -p web/ui-dist
          cp "$RUNNER_TEMP/release-ui/index.html" web/ui-dist/index.html
      - name: build and reproduce the Linux release artifact
        run: |
          bun run wispd/scripts/release-linux.ts --require-tag
          dir="dist/release/$GITHUB_REF_NAME"
          first="$(mktemp -d)"
          cp "$dir"/* "$first"/
          bun run wispd/scripts/release-linux.ts --require-tag
          for file in "$first"/*; do
            cmp -s "$file" "$dir/$(basename "$file")" || {
              echo "non-reproducible asset: $(basename "$file")" >&2
              exit 1
            }
          done
          (cd "$dir" && sha256sum -c SHA256SUMS)
      - name: exercise installer and activation contracts
        run: |
          artifact="dist/release/$GITHUB_REF_NAME/wisp-v${GITHUB_REF_NAME#v}-linux-x86_64"
          WISP_ARTIFACT_PATH="$PWD/$artifact" bun run test:install
          WISP_ARTIFACT_PATH="$PWD/$artifact" bun run test:activation
      - name: stage Linux assets for publication
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-linux-assets
          path: dist/release/${{ github.ref_name }}/*
          retention-days: 7
          if-no-files-found: error

  # Independent clean runners are a stronger reproducibility check than two
  # serial builds in one workspace. Both consume the exact Linux-produced UI.
  macos-repro:
    needs: release-source
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        copy: [a, b]
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: restore and verify the annotated release tag
        run: |
          git fetch --force origin \
            "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          test "$(git cat-file -t "refs/tags/$GITHUB_REF_NAME")" = tag
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch
        with:
          toolchain: 1.96.1
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: desktop/src-tauri
          cache-targets: false
      - name: collect and verify the shared UI bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: canonical-ui-bundle
          path: ${{ runner.temp }}/release-ui
      - name: install the shared UI bundle
        run: |
          (cd "$RUNNER_TEMP/release-ui" && shasum -a 256 -c SHA256SUMS)
          mkdir -p web/ui-dist
          cp "$RUNNER_TEMP/release-ui/index.html" web/ui-dist/index.html
      - name: build clean macOS reproducibility payload
        run: |
          bun run wispd/scripts/release-macos.ts --require-tag
          WISP_PREBUILT_UI=1 \
            CARGO_TARGET_DIR="$RUNNER_TEMP/wisp-desktop-release-repro" \
            bun run scripts/release-desktop.ts --require-tag
      - name: stage macOS reproducibility payload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-macos-repro-${{ matrix.copy }}
          path: dist/release/${{ github.ref_name }}/*
          retention-days: 7
          if-no-files-found: error

  # Secrets are isolated to the one job that needs them. It Developer ID signs,
  # notarizes, and staples the daemon app, then signs, notarizes,
  # staples, updater-signs, and negatively tests Desktop in parallel with the
  # credential-free builders.
  macos-trusted:
    needs: release-source
    if: github.event_name == 'push'
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: restore and verify the annotated release tag
        run: |
          git fetch --force origin \
            "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          test "$(git cat-file -t "refs/tags/$GITHUB_REF_NAME")" = tag
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch
        with:
          toolchain: 1.96.1
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: desktop/src-tauri
          cache-targets: false
      - name: require trusted macOS release credentials
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          for name in \
            APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
            APPLE_API_ISSUER APPLE_API_KEY APPLE_API_PRIVATE_KEY \
            TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD
          do
            test -n "${!name}" || {
              echo "missing required macOS release secret: $name" >&2
              exit 1
            }
          done
          key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
          install -m 600 /dev/null "$key_path"
          printf '%s' "$APPLE_API_PRIVATE_KEY" > "$key_path"
          echo "APPLE_API_KEY_PATH=$key_path" >> "$GITHUB_ENV"
      - name: collect and verify the shared UI bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: canonical-ui-bundle
          path: ${{ runner.temp }}/release-ui
      - name: install the shared UI bundle
        run: |
          (cd "$RUNNER_TEMP/release-ui" && shasum -a 256 -c SHA256SUMS)
          mkdir -p web/ui-dist
          cp "$RUNNER_TEMP/release-ui/index.html" web/ui-dist/index.html
      - name: build and verify the trusted macOS releases
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          certificate="$RUNNER_TEMP/release-certificate.p12"
          keychain="$RUNNER_TEMP/release-signing.keychain-db"
          keychain_password="$(openssl rand -hex 32)"
          printf '%s' "$APPLE_CERTIFICATE" | /usr/bin/base64 -D > "$certificate"
          chmod 0600 "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -k "$keychain" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: -s \
            -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain"
          security default-keychain -d user -s "$keychain"
          trap 'security delete-keychain "$keychain" >/dev/null 2>&1 || true; rm -f "$certificate"' EXIT
          unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD

          bun run wispd/scripts/release-macos.ts --require-tag --signed
          target="$RUNNER_TEMP/wisp-desktop-release-signed"
          WISP_PREBUILT_UI=1 CARGO_TARGET_DIR="$target" \
            bun run scripts/release-desktop.ts --require-tag --signed
          dir="dist/release/$GITHUB_REF_NAME"
          artifact="$dir/wisp-desktop-${GITHUB_REF_NAME}-darwin-arm64.tar.gz"
          signature="$artifact.sig"
          verifier="$target/aarch64-apple-darwin/release/verify-update-signature"
          test -x "$verifier"
          "$verifier" "$artifact" "$signature" desktop/src-tauri/updater-public.key
          tampered="$(mktemp)"
          cp "$artifact" "$tampered"
          printf 'tampered' >> "$tampered"
          if "$verifier" "$tampered" "$signature" desktop/src-tauri/updater-public.key; then
            echo "updater signature accepted a changed artifact" >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/release-verifier"
          cp "$verifier" "$RUNNER_TEMP/release-verifier/verify-update-signature"
          (cd "$RUNNER_TEMP/release-verifier" &&
            shasum -a 256 verify-update-signature > SHA256SUMS)
      - name: stage trusted macOS assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-trusted-macos-assets
          path: dist/release/${{ github.ref_name }}/*
          retention-days: 7
          if-no-files-found: error
      - name: stage updater verifier
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-update-verifier
          path: ${{ runner.temp }}/release-verifier/*
          retention-days: 7
          if-no-files-found: error

  publish:
    needs: [release-linux, macos-repro, macos-trusted]
    if: github.event_name == 'push'
    # This remains the single publication point. It receives only verified
    # artifacts, compares the independent Mac payloads, and has no Apple or tap
    # write credential.
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: write # create the GitHub release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: restore and verify the annotated release tag
        run: |
          git fetch --force origin \
            "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          test "$(git cat-file -t "refs/tags/$GITHUB_REF_NAME")" = tag
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: collect release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-*
          path: ${{ runner.temp }}/release-artifacts
          merge-multiple: false
      - name: require independent byte-identical macOS payloads
        run: |
          artifacts="$RUNNER_TEMP/release-artifacts"
          first="$artifacts/release-macos-repro-a"
          second="$artifacts/release-macos-repro-b"
          expected="$(printf '%s\n' \
            SHA256SUMS-darwin-arm64 \
            SHA256SUMS-desktop-darwin-arm64 \
            release-manifest-darwin-arm64.json \
            release-manifest-desktop-darwin-arm64.json \
            "wisp-${GITHUB_REF_NAME}-darwin-arm64.tar.gz" \
            "wisp-desktop-${GITHUB_REF_NAME}-darwin-arm64.tar.gz" | LC_ALL=C sort)"
          for directory in "$first" "$second"; do
            actual="$(for file in "$directory"/*; do basename "$file"; done | LC_ALL=C sort)"
            test "$actual" = "$expected"
          done
          trusted="$artifacts/release-trusted-macos-assets"
          trusted_expected="$(printf '%s\n' \
            SHA256SUMS-darwin-arm64 \
            SHA256SUMS-desktop-darwin-arm64 \
            release-manifest-darwin-arm64.json \
            release-manifest-desktop-darwin-arm64.json \
            "wisp-${GITHUB_REF_NAME}-darwin-arm64.tar.gz" \
            "wisp-desktop-${GITHUB_REF_NAME}-darwin-arm64.tar.gz" \
            "wisp-desktop-${GITHUB_REF_NAME}-darwin-arm64.tar.gz.sig" | LC_ALL=C sort)"
          trusted_actual="$(for file in "$trusted"/*; do basename "$file"; done | LC_ALL=C sort)"
          test "$trusted_actual" = "$trusted_expected"
          for file in "$first"/*; do
            cmp -s "$file" "$second/$(basename "$file")" || {
              echo "non-reproducible asset: $(basename "$file")" >&2
              exit 1
            }
          done
          dir="dist/release/$GITHUB_REF_NAME"
          mkdir -p "$dir"
          cp "$first"/* "$dir"/
          cp "$trusted"/* "$dir"/
          cp "$artifacts/release-linux-assets"/* "$dir"/
          (cd "$dir" &&
            shasum -a 256 -c SHA256SUMS-darwin-arm64 &&
            shasum -a 256 -c SHA256SUMS-desktop-darwin-arm64)
          verifier_dir="$artifacts/release-update-verifier"
          (cd "$verifier_dir" &&
            shasum -a 256 -c SHA256SUMS &&
            chmod 0755 verify-update-signature)
          verifier="$verifier_dir/verify-update-signature"
          artifact="$dir/wisp-desktop-${GITHUB_REF_NAME}-darwin-arm64.tar.gz"
          signature="$artifact.sig"
          "$verifier" "$artifact" "$signature" desktop/src-tauri/updater-public.key
          tampered="$(mktemp)"
          cp "$artifact" "$tampered"
          printf 'tampered' >> "$tampered"
          if "$verifier" "$tampered" "$signature" desktop/src-tauri/updater-public.key; then
            echo "updater signature accepted a changed artifact" >&2
            exit 1
          fi

      - name: resolve version and require release notes
        id: version
        run: |
          bun -e '
            import { existsSync, appendFileSync } from "node:fs";
            import { releaseVersion, releaseNotesPath } from "./scripts/release-promotion";
            const version = releaseVersion(process.env.GITHUB_REF_NAME);
            const notes = releaseNotesPath(process.cwd(), process.env.GITHUB_REF_NAME);
            if (!existsSync(notes)) throw new Error("missing release notes");
            appendFileSync(process.env.GITHUB_OUTPUT,
              `version=${version}\nnotes=${notes}\nprerelease=${version.includes("-")}\n`);
          '

      - name: verify all ten assets through their checksum sets
        run: |
          cd "dist/release/$GITHUB_REF_NAME"
          shasum -a 256 -c SHA256SUMS
          shasum -a 256 -c SHA256SUMS-darwin-arm64
          shasum -a 256 -c SHA256SUMS-desktop-darwin-arm64

      - name: require an unused public release identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          probe="$(mktemp)"
          if gh api --include \
            "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" >"$probe" 2>&1; then
            echo "release already exists and will not be mutated: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          grep -Eq '^HTTP/[0-9.]+ 404 ' "$probe" || {
            echo "could not prove release identity is unused: $(head -n 1 "$probe")" >&2
            exit 1
          }

      # Immutable publication needs only a public, read-only tap checkout.
      # The write credential is exposed solely to the later promotion job.
      - name: clone the Homebrew tap read-only
        run: git clone --branch main --single-branch https://github.com/Pepewitch/homebrew-tap.git homebrew-tap

      # Render from the locally verified manifests and prove both recipes load
      # before the public release exists. Online URL audits follow publication.
      - name: prepare and audit the Homebrew Formula and Cask offline
        run: |
          tap="$GITHUB_WORKSPACE/homebrew-tap"
          git -C "$tap" fetch origin main
          test "$(git -C "$tap" rev-parse HEAD)" = "$(git -C "$tap" rev-parse origin/main)"
          test -z "$(git -C "$tap" status --porcelain=v1 --untracked-files=all)"
          bun test tests/homebrew-formula.test.ts tests/homebrew-cask.test.ts
          bun run scripts/render-homebrew-formula.ts \
            --manifest "dist/release/$GITHUB_REF_NAME/release-manifest-darwin-arm64.json" \
            --output "$tap/Formula/wisp.rb"
          bun run scripts/render-homebrew-cask.ts \
            --manifest "dist/release/$GITHUB_REF_NAME/release-manifest-desktop-darwin-arm64.json" \
            --output "$tap/Casks/wisp-desktop.rb"
          bun run scripts/render-desktop-update-channel.ts \
            --manifest "dist/release/$GITHUB_REF_NAME/release-manifest-desktop-darwin-arm64.json" \
            --notes "${{ steps.version.outputs.notes }}" \
            --output "$tap/updates/wisp-desktop-alpha.json"
          bun run scripts/render-daemon-update-channel.ts \
            --manifest "dist/release/$GITHUB_REF_NAME/release-manifest.json" \
            --desktop-manifest "dist/release/$GITHUB_REF_NAME/release-manifest-desktop-darwin-arm64.json" \
            --output "$tap/updates/wisp-daemon.json"
          expected="$(printf '%s\n' Casks/wisp-desktop.rb Formula/wisp.rb updates/wisp-daemon.json updates/wisp-desktop-alpha.json)"
          actual="$(git -C "$tap" status --porcelain=v1 --untracked-files=all | cut -c4- | LC_ALL=C sort)"
          test "$actual" = "$expected"
          brew tap-new --no-git Pepewitch/tap
          audit_tap="$(brew --repository Pepewitch/tap)"
          mkdir -p "$audit_tap/Casks"
          cp "$tap/Formula/wisp.rb" "$audit_tap/Formula/wisp.rb"
          cp "$tap/Casks/wisp-desktop.rb" "$audit_tap/Casks/wisp-desktop.rb"
          brew style "$audit_tap/Formula/wisp.rb" "$audit_tap/Casks/wisp-desktop.rb"
          brew audit --strict Pepewitch/tap/wisp
          brew audit --strict --cask Pepewitch/tap/wisp-desktop
          git -C "$tap" diff --check
          # `brew audit` is static: it never stages an archive, so it cannot
          # see a layout the formula's own install block fails on. Homebrew
          # descends into a lone top-level directory before `install` runs, so
          # an archive whose only entry is the bundle leaves the formula
          # standing inside it. 0.5.14 shipped exactly that and could not be
          # installed by anyone. Prove the real bytes before publication.
          staged="$(mktemp -d)"
          tar -xzf \
            "dist/release/$GITHUB_REF_NAME/wisp-${GITHUB_REF_NAME}-darwin-arm64.tar.gz" \
            -C "$staged"
          archive_root="wisp-${GITHUB_REF_NAME}-darwin-arm64"
          test "$(ls -A "$staged")" = "$archive_root"
          test -d "$staged/$archive_root/Wisp Daemon.app"
          test -x "$staged/$archive_root/Wisp Daemon.app/Contents/MacOS/wisp"
          grep -F 'libexec.install "Wisp Daemon.app"' "$tap/Formula/wisp.rb"

      # releasing.md step 6: one release, the exact ten assets, and the
      # release notes as the body. Never clobber or mutate after publishing.
      - name: publish the GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          name: "Wisp ${{ steps.version.outputs.version }}"
          body_path: ${{ steps.version.outputs.notes }}
          prerelease: ${{ steps.version.outputs.prerelease == 'true' }}
          make_latest: ${{ steps.version.outputs.prerelease == 'false' }}
          fail_on_unmatched_files: true
          overwrite_files: false
          files: |
            dist/release/${{ github.ref_name }}/wisp-${{ github.ref_name }}-linux-x86_64
            dist/release/${{ github.ref_name }}/release-manifest.json
            dist/release/${{ github.ref_name }}/SHA256SUMS
            dist/release/${{ github.ref_name }}/wisp-${{ github.ref_name }}-darwin-arm64.tar.gz
            dist/release/${{ github.ref_name }}/release-manifest-darwin-arm64.json
            dist/release/${{ github.ref_name }}/SHA256SUMS-darwin-arm64
            dist/release/${{ github.ref_name }}/wisp-desktop-${{ github.ref_name }}-darwin-arm64.tar.gz
            dist/release/${{ github.ref_name }}/wisp-desktop-${{ github.ref_name }}-darwin-arm64.tar.gz.sig
            dist/release/${{ github.ref_name }}/release-manifest-desktop-darwin-arm64.json
            dist/release/${{ github.ref_name }}/SHA256SUMS-desktop-darwin-arm64

      # releasing.md step 7: verify the bytes anonymous users can fetch.
      - name: verify anonymous public downloads
        run: |
          dir="dist/release/$GITHUB_REF_NAME"
          anon="$(mktemp -d)"
          download() {
            file="$1"
            for _ in 1 2 3 4 5; do
              curl --proto '=https' --tlsv1.2 -fsSL \
                "https://github.com/Pepewitch/wisp/releases/download/$GITHUB_REF_NAME/$file" \
                -o "$anon/$file" && return 0
              sleep 10
            done
            echo "public asset missing: $file" >&2
            return 1
          }
          files=(
            "wisp-${GITHUB_REF_NAME}-linux-x86_64"
            release-manifest.json
            SHA256SUMS
            "wisp-${GITHUB_REF_NAME}-darwin-arm64.tar.gz"
            release-manifest-darwin-arm64.json
            SHA256SUMS-darwin-arm64
            "wisp-desktop-${GITHUB_REF_NAME}-darwin-arm64.tar.gz"
            "wisp-desktop-${GITHUB_REF_NAME}-darwin-arm64.tar.gz.sig"
            release-manifest-desktop-darwin-arm64.json
            SHA256SUMS-desktop-darwin-arm64
          )
          pids=()
          for file in "${files[@]}"; do
            download "$file" &
            pids+=("$!")
          done
          failed=0
          for pid in "${pids[@]}"; do
            wait "$pid" || failed=1
          done
          [ "$failed" = 0 ] || exit 1
          for file in "${files[@]}"; do
            cmp -s "$dir/$file" "$anon/$file" || {
              echo "public asset differs: $file" >&2
              exit 1
            }
          done
          (cd "$anon" &&
            shasum -a 256 -c SHA256SUMS &&
            shasum -a 256 -c SHA256SUMS-darwin-arm64 &&
            shasum -a 256 -c SHA256SUMS-desktop-darwin-arm64)
          daemon_extracted="$(mktemp -d)"
          tar -xzf "$anon/wisp-${GITHUB_REF_NAME}-darwin-arm64.tar.gz" \
            -C "$daemon_extracted"
          daemon_root="$daemon_extracted/wisp-${GITHUB_REF_NAME}-darwin-arm64"
          test "$(ls -A "$daemon_extracted")" = "wisp-${GITHUB_REF_NAME}-darwin-arm64"
          daemon_app="$daemon_root/Wisp Daemon.app"
          daemon="$daemon_app/Contents/MacOS/wisp"
          codesign --verify --deep --strict --verbose=2 "$daemon_app"
          daemon_signature="$(codesign --display --verbose=4 "$daemon" 2>&1)"
          grep -F 'Identifier=dev.wisp.daemon' <<<"$daemon_signature"
          grep -F 'Authority=Developer ID Application:' <<<"$daemon_signature"
          grep -E '^TeamIdentifier=.+$' <<<"$daemon_signature"
          grep -E '^Timestamp=.+$' <<<"$daemon_signature"
          grep -E '^CodeDirectory .*flags=.*\(runtime\)' <<<"$daemon_signature"
          daemon_requirement="$(codesign --display --requirements - "$daemon" 2>&1)"
          grep -F 'identifier "dev.wisp.daemon"' <<<"$daemon_requirement"
          grep -F 'anchor apple generic' <<<"$daemon_requirement"
          ! grep -F 'cdhash' <<<"$daemon_requirement"
          xcrun stapler validate "$daemon_app"
          spctl --assess --type execute --verbose=4 "$daemon_app"
          verifier="$RUNNER_TEMP/release-artifacts/release-update-verifier/verify-update-signature"
          "$verifier" \
            "$anon/wisp-desktop-${GITHUB_REF_NAME}-darwin-arm64.tar.gz" \
            "$anon/wisp-desktop-${GITHUB_REF_NAME}-darwin-arm64.tar.gz.sig" \
            desktop/src-tauri/updater-public.key
          tampered="$(mktemp)"
          cp "$anon/wisp-desktop-${GITHUB_REF_NAME}-darwin-arm64.tar.gz" "$tampered"
          printf 'tampered' >> "$tampered"
          if "$verifier" \
            "$tampered" \
            "$anon/wisp-desktop-${GITHUB_REF_NAME}-darwin-arm64.tar.gz.sig" \
            desktop/src-tauri/updater-public.key
          then
            echo "updater signature accepted a changed artifact" >&2
            exit 1
          fi
          extracted="$(mktemp -d)"
          tar -xzf "$anon/wisp-desktop-${GITHUB_REF_NAME}-darwin-arm64.tar.gz" -C "$extracted"
          codesign --verify --deep --strict --verbose=2 "$extracted/Wisp.app"
          xcrun stapler validate "$extracted/Wisp.app"
          spctl --assess --type execute --verbose=4 "$extracted/Wisp.app"

      # The last gate the tap never had: actually install the rendered Formula
      # from the public release, the way a user does. Everything above this
      # point passed for 0.5.14, which no user could install. This runs after
      # immutable publication because the Formula's url must resolve; a failure
      # here leaves the release published and unpromoted, which is recoverable,
      # and keeps a broken Formula out of the tap.
      - name: install the published Formula the way a user does
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_ANALYTICS: 1
        run: |
          audit_tap="$(brew --repository Pepewitch/tap)"
          test -f "$audit_tap/Formula/wisp.rb"
          # Homebrew 7 gates third-party taps behind explicit trust.
          if brew help trust >/dev/null 2>&1; then
            brew trust --formula Pepewitch/tap/wisp
          fi
          brew install --formula Pepewitch/tap/wisp
          brew test --formula Pepewitch/tap/wisp
          prefix="$(brew --prefix wisp)"
          app="$prefix/libexec/Wisp Daemon.app"
          test -x "$app/Contents/MacOS/wisp"
          test -L "$prefix/bin/wisp"
          codesign --verify --deep --strict --verbose=2 "$app"
          "$prefix/bin/wisp" version | grep -F "${GITHUB_REF_NAME#v}"
          brew uninstall --formula Pepewitch/tap/wisp

  promote:
    needs: publish
    if: always() && ((github.event_name == 'push' && needs.publish.result == 'success') || github.event_name == 'workflow_dispatch')
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Recovery uses the current workflow implementation from the chosen
          # branch; a separate checkout below supplies immutable tag inputs.
          fetch-depth: 0
          fetch-tags: true
      - name: require main for manual recovery
        if: github.event_name == 'workflow_dispatch'
        run: test "$GITHUB_REF" = refs/heads/main
      - name: checkout the immutable release source for recovery
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          fetch-tags: true
          path: release-source
      - name: restore and verify the annotated release tag
        run: |
          release_root=.
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            release_root=release-source
          fi
          git -C "$release_root" fetch --force origin \
            "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          test "$(git -C "$release_root" cat-file -t "refs/tags/$RELEASE_TAG")" = tag
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch
        if: github.event_name == 'workflow_dispatch'
        with:
          toolchain: 1.96.1
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: github.event_name == 'workflow_dispatch'
        with:
          workspaces: desktop/src-tauri
      - name: collect updater verifier
        if: github.event_name == 'push'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-update-verifier
          path: ${{ runner.temp }}/release-verifier
      - name: verify updater verifier
        if: github.event_name == 'push'
        run: |
          (cd "$RUNNER_TEMP/release-verifier" &&
            shasum -a 256 -c SHA256SUMS &&
            chmod 0755 verify-update-signature)
          echo "WISP_UPDATE_VERIFIER=$RUNNER_TEMP/release-verifier/verify-update-signature" >> "$GITHUB_ENV"
      - name: checkout the Homebrew tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Pepewitch/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          ref: main
          fetch-depth: 0
          path: homebrew-tap
      - name: promote the verified public release
        env:
          GH_TOKEN: ${{ github.token }}
          HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          mkdir -p dist/promotion
          release_root=.
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            release_root=release-source
          fi
          bun run release:promote -- \
            --tag "$RELEASE_TAG" \
            --tap-dir homebrew-tap \
            --release-root "$release_root" \
            --receipt dist/promotion/promotion-receipt.json \
            --publish 2>&1 | tee dist/promotion/promotion.log
      - name: retain promotion diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-promotion-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/promotion/promotion.log
            dist/promotion/promotion-receipt.json
          retention-days: 30
          if-no-files-found: warn
