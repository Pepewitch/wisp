name: dependency-advisories
# Advisories are published by third parties on their schedule, not ours. A
# review found that this repository learned about them only during a manual
# audit: PR CI had no advisory check, and the release job had none either
# (SEC-07). So they are checked here, weekly, where a new disclosure produces
# one red run that is somebody's job — instead of failing an unrelated pull
# request the day it lands.
#
# Both ecosystems are checked, because both ship: the npm tree builds the UI
# bundle embedded in the daemon binary, and the Cargo lock is the macOS desktop
# shell.
on:
  schedule:
    # Mondays, early UTC: a week's disclosures, reviewed before the week starts.
    - cron: "17 6 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/dependency-advisories.yml"
      - "bun.lock"
      - "desktop/src-tauri/Cargo.lock"

permissions:
  contents: read

jobs:
  npm:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: audit the locked npm tree
        run: bun audit

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch
        with:
          toolchain: 1.96.1
      # The advisory database is a moving target, so the tool has to be able to
      # parse today's entries: 0.21 failed on a 2026 advisory whose format it
      # predated, which is a tooling error rather than a finding. Keep this
      # floor current when a run reports a parse error.
      - name: install cargo-audit
        run: cargo install cargo-audit --locked --version ^0.22
      # Reads the lock, so this needs no macOS runner and no build. Default
      # behavior is what is wanted: a vulnerability fails the run, while
      # unmaintained-crate notices are printed without failing it. A review
      # found seven of the latter, mostly in Tauri's Linux GTK tree, which the
      # macOS release does not compile at all — maintenance risk to triage,
      # not a reason to redden every week's run.
      - name: audit the locked Cargo tree
        working-directory: desktop/src-tauri
        run: cargo audit
