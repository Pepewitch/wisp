name: release-candidate

# Exercise the exact Linux artifact contract before a maintainer authorizes a
# tag. Release preparation always changes the version source, while changes to
# daemon/UI/build/install inputs also opt into this inexpensive Ubuntu gate.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "shared/**"
      - "web/**"
      - "wispd/**"
      - "scripts/install.sh"
      - "scripts/promote-release.ts"
      - "scripts/release-desktop.ts"
      - "scripts/update-verifier/**"
      - "tests/release-activation.test.ts"
      - "tests/promote-release.test.ts"
      - "tests/release-desktop.test.ts"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/release.yml"
      - ".github/workflows/release-candidate.yml"
      - ".github/workflows/release-promotion.yml"
  workflow_dispatch:

concurrency:
  group: release-candidate-${{ github.event.pull_request.number || github.sha }}
  # Supersede stale PR checks, but preserve every main result because a tag
  # may be waiting on that exact commit while newer work lands.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  update-verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch
        with:
          toolchain: 1.96.1
          components: clippy, rustfmt
      - name: validate the standalone updater verifier
        run: |
          cargo fmt --manifest-path scripts/update-verifier/Cargo.toml -- --check
          cargo clippy --locked --manifest-path scripts/update-verifier/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path scripts/update-verifier/Cargo.toml

  linux-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run version:check
      - name: build the candidate Linux artifact
        run: |
          bun run build:ui
          bun run wispd/scripts/release-linux.ts
      - name: exercise installer and activation contracts
        run: |
          version="$(bun -e 'import { VERSION } from "./wispd/src/version"; process.stdout.write(VERSION)')"
          artifact="dist/release/v$version/wisp-v$version-linux-x86_64"
          WISP_ARTIFACT_PATH="$PWD/$artifact" bun run test:install
          WISP_ARTIFACT_PATH="$PWD/$artifact" bun run test:activation
