name: desktop
# The desktop shell is a macOS-only Rust crate, so it needs its own runner. It
# is path-filtered because a macOS runner costs ten times a Linux one and most
# changes in this repository do not touch it.
on:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - "scripts/desktop/**"
      - ".github/workflows/desktop.yml"
  pull_request:
    paths:
      - "desktop/**"
      - "scripts/desktop/**"
      - ".github/workflows/desktop.yml"

jobs:
  native-core:
    runs-on: macos-15
    defaults:
      run:
        working-directory: desktop/src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
        working-directory: .
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.1
          components: clippy, rustfmt
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: formatting
        run: cargo fmt --all --check
      - name: lint
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: unit and integration tests
        # Every test uses the in-memory credential store; nothing here reads or
        # writes a real login keychain.
        run: cargo test
      - name: bundle the packaged application
        working-directory: .
        run: bash scripts/desktop/build-macos.sh --app-only
      - name: verify the complete ad-hoc signature and architecture
        working-directory: .
        run: |
          app=desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Wisp.app
          codesign --verify --deep --strict "$app"
          file "$app/Contents/MacOS/wisp-desktop" | grep -q 'Mach-O 64-bit executable arm64'
          if strings "$app/Contents/MacOS/wisp-desktop" | grep -Eq '/Users/|\.cargo/registry|\.rustup/toolchains'; then
            echo 'desktop binary contains a builder path' >&2
            exit 1
          fi
