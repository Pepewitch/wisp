name: desktop
# The desktop shell is a macOS-only Rust crate, so it needs its own runner. It
# is path-filtered because a macOS runner costs ten times a Linux one and most
# changes in this repository do not touch it.
on:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - "scripts/desktop/**"
      - "scripts/release-desktop.ts"
      - "scripts/render-homebrew-cask.ts"
      - "scripts/render-desktop-update-channel.ts"
      - "tests/release-desktop.test.ts"
      - "tests/homebrew-cask.test.ts"
      - "tests/desktop-update-channel.test.ts"
      - "web/**"
      - "wispd/package.json"
      - "wispd/src/version.ts"
      - "wispd/scripts/build-binary.ts"
      - "wispd/scripts/release-linux.ts"
      - "wispd/scripts/release-macos.ts"
      - "wispd/tests/release-linux.test.ts"
      - "wispd/tests/release-macos.test.ts"
      # The native proxy implements the daemon's auth, route, header, SSE,
      # WebSocket, and media contract, so a daemon-side change to any of those
      # can break it without touching desktop/ (ENG-10).
      - "wispd/src/daemon.ts"
      - "wispd/src/routes/**"
      - "wispd/src/types.ts"
      - "wispd/tests/helpers/**"
      - "wispd/tests/desktop-transport.test.ts"
      - "package.json"
      - "bun.lock"
      - "tsconfig.json"
      - ".github/workflows/desktop.yml"
      - ".github/workflows/release.yml"
  pull_request:
    paths:
      - "desktop/**"
      - "scripts/desktop/**"
      - "scripts/release-desktop.ts"
      - "scripts/render-homebrew-cask.ts"
      - "scripts/render-desktop-update-channel.ts"
      - "tests/release-desktop.test.ts"
      - "tests/homebrew-cask.test.ts"
      - "tests/desktop-update-channel.test.ts"
      - "web/**"
      - "wispd/package.json"
      - "wispd/src/version.ts"
      - "wispd/scripts/build-binary.ts"
      - "wispd/scripts/release-linux.ts"
      - "wispd/scripts/release-macos.ts"
      - "wispd/tests/release-linux.test.ts"
      - "wispd/tests/release-macos.test.ts"
      # The native proxy implements the daemon's auth, route, header, SSE,
      # WebSocket, and media contract, so a daemon-side change to any of those
      # can break it without touching desktop/ (ENG-10).
      - "wispd/src/daemon.ts"
      - "wispd/src/routes/**"
      - "wispd/src/types.ts"
      - "wispd/tests/helpers/**"
      - "wispd/tests/desktop-transport.test.ts"
      - "package.json"
      - "bun.lock"
      - "tsconfig.json"
      - ".github/workflows/desktop.yml"
      - ".github/workflows/release.yml"

# Least privilege by default: a job that needs more says so itself, so a new
# job cannot inherit release or publication rights by being added here.
permissions:
  contents: read

jobs:
  native-core:
    runs-on: macos-15
    defaults:
      run:
        working-directory: desktop/src-tauri
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
        working-directory: .
      - name: build shared UI bundle
        run: bun run build:ui
        working-directory: .
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch
        with:
          toolchain: 1.96.1
          components: clippy, rustfmt
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: desktop/src-tauri
      - name: formatting
        run: cargo fmt --all --check
      - name: lint
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: unit and integration tests
        # Every test uses the in-memory credential store; nothing here reads or
        # writes a real login keychain.
        run: cargo test --locked
      - name: build and verify the release application
        working-directory: .
        run: bun run scripts/release-desktop.ts
      - name: verify the complete ad-hoc signature and architecture
        working-directory: .
        run: |
          app=desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Wisp.app
          codesign --verify --deep --strict "$app"
          file "$app/Contents/MacOS/wisp-desktop" | grep -q 'Mach-O 64-bit executable arm64'
          if strings "$app/Contents/MacOS/wisp-desktop" | grep -Eq '/Users/|\.cargo/registry|\.rustup/toolchains'; then
            echo 'desktop binary contains a builder path' >&2
            exit 1
          fi
      - name: launch the packaged application
        working-directory: .
        run: |
          app=desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Wisp.app
          launch_log="$(mktemp)"
          "$app/Contents/MacOS/wisp-desktop" >"$launch_log" 2>&1 &
          app_pid=$!
          cleanup() {
            kill "$app_pid" 2>/dev/null || true
            wait "$app_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          sleep 4
          if ! kill -0 "$app_pid" 2>/dev/null; then
            sed -n '1,120p' "$launch_log"
            echo 'packaged desktop application did not remain alive' >&2
            exit 1
          fi
