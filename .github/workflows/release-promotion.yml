name: release-promotion

on:
  push:
    branches: [main]
    paths:
      - "scripts/promote-release.ts"
      - "scripts/promotion-fixture.ts"
      - "scripts/release-promotion.ts"
      - "scripts/render-homebrew-formula.ts"
      - "scripts/render-homebrew-cask.ts"
      - "scripts/render-daemon-update-channel.ts"
      - "scripts/render-desktop-update-channel.ts"
      - "wispd/scripts/release-linux.ts"
      - "wispd/scripts/release-macos.ts"
      - "wispd/package.json"
      - "tests/promote-release.test.ts"
      - "tests/homebrew-formula.test.ts"
      - "tests/homebrew-cask.test.ts"
      - "tests/daemon-update-channel.test.ts"
      - "tests/desktop-update-channel.test.ts"
      - ".github/workflows/release.yml"
      - ".github/workflows/release-promotion.yml"
      - "package.json"
      - "bun.lock"
  pull_request:
    paths:
      - "scripts/promote-release.ts"
      - "scripts/promotion-fixture.ts"
      - "scripts/release-promotion.ts"
      - "scripts/render-homebrew-formula.ts"
      - "scripts/render-homebrew-cask.ts"
      - "scripts/render-daemon-update-channel.ts"
      - "scripts/render-desktop-update-channel.ts"
      - "wispd/scripts/release-linux.ts"
      - "wispd/scripts/release-macos.ts"
      - "wispd/package.json"
      - "tests/promote-release.test.ts"
      - "tests/homebrew-formula.test.ts"
      - "tests/homebrew-cask.test.ts"
      - "tests/daemon-update-channel.test.ts"
      - "tests/desktop-update-channel.test.ts"
      - ".github/workflows/release.yml"
      - ".github/workflows/release-promotion.yml"
      - "package.json"
      - "bun.lock"

# Least privilege by default: a job that needs more says so itself, so a new
# job cannot inherit release or publication rights by being added here.
permissions:
  contents: read

jobs:
  public-promotion-dry-run:
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch
        with:
          toolchain: 1.96.1
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: desktop/src-tauri
      - name: exercise the public promotion path without publishing
        env:
          GH_TOKEN: ${{ github.token }}
          HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
        run: |
          # The fixture is whichever release the tap currently serves, read out
          # of the tap itself. Nothing here names a version, so this cannot go
          # stale when a later release is promoted.
          mkdir -p dist/promotion-check
          release_root=dist/promotion-check/release-source
          tap=dist/promotion-check/homebrew-tap
          receipt=dist/promotion-check/promotion-receipt.json
          git clone https://github.com/Pepewitch/homebrew-tap.git "$tap"
          tag="$(bun run scripts/promotion-fixture.ts --tap-dir "$tap")"
          echo "replaying the promoted release $tag"
          git fetch --force origin main "refs/tags/$tag:refs/tags/$tag"
          git worktree add --detach "$release_root" "$tag"
          bun run release:promote -- \
            --tag "$tag" \
            --release-root "$release_root" \
            --tap-dir "$tap" \
            --receipt "$receipt"
          result="$(jq -r .result "$receipt")"
          state="$(jq -r .tapState "$receipt")"
          test "$result" = dry-run || {
            echo "::error::promotion receipt recorded $result, expected an unpublished dry run"
            exit 1
          }
          # The fixture is the release the tap serves, so re-rendering it must
          # reproduce the tap byte for byte. Anything else means this change
          # would rewrite files that are already public.
          test "$state" = already-promoted || {
            echo "::error::replaying $tag reported tapState=$state, so this change would rewrite the" \
              "already-published tap files for $tag; inspect the retained receipt and the tap diff"
            exit 1
          }
      - name: retain promotion diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-promotion-dry-run-${{ github.run_attempt }}
          path: dist/promotion-check/promotion-receipt.json
          retention-days: 14
          if-no-files-found: warn
