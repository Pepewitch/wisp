name: ci
on:
  push:
    branches: [main]
  pull_request:

# Least privilege by default: a job that needs more says so itself, so a new
# job cannot inherit release or publication rights by being added here.
permissions:
  contents: read

# The suites are independent, so they run side by side rather than one after
# another in a single seven-minute job. `test` at the bottom is the one status
# branch protection requires; it passes only when every part here did.
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: doc links, version pins, and workflow pins
        run: bun run docs:check && bun run version:check && bun run workflows:check
      - name: lint
        run: bun run lint:all
      - name: typecheck
        run: bun run typecheck:all
      - name: root tests
        run: bun run test:root
      - name: brand assets are current
        # SVGs + the app's inlined favicon only; the two PNGs need Chrome, and
        # build.ts skips them (rather than failing) when there is no browser
        run: bun run brand:check
      - name: build (the compiled binary must embed the generated UI)
        run: bun run build
      - name: the compiled binary searches off its request thread
        run: bun run wispd/scripts/check-binary-search.ts dist/wisp
      - name: build linux-x64 deploy artifact
        # Through the build script, so the artifact carries the same entry
        # points (the search worker) as a release binary.
        run: bun run wispd/scripts/build-binary.ts --target linux-x64 --outfile dist/wisp-linux-x64
      # The documented glibc floor is a property of the pinned Bun runtime, so
      # a toolchain bump that raises it fails here rather than in a published
      # install guide.
      - name: the artifact still meets the documented glibc floor
        run: bun -e 'import { assertGlibcFloor } from "./wispd/scripts/release-linux"; assertGlibcFloor("dist/wisp-linux-x64");'

  # The daemon suite mostly WAITS (process groups, kill grace, restarts), so
  # it splits well. Each shard is an ordinary `bun test` process with its own
  # preload and throwaway home, exactly as a full local run is. `--parallel`
  # is not usable: its per-file isolation drops the preload's store handle.
  # Files are split by recorded duration (scripts/test-shards.ts), not by
  # name: the slow files sort next to each other, and `--shard` gave one
  # shard twice the others' time.
  daemon:
    name: daemon (${{ matrix.shard }}/6)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      # The daemon imports the generated web bundle; some contract tests also
      # inspect the Desktop bundle to check the two runtime paths.
      - run: bun run build:all-ui
      - name: daemon tests, shard ${{ matrix.shard }} of 6
        env:
          SHARD: ${{ matrix.shard }}
        run: bun scripts/test-shards.ts --run "$SHARD/6"

  web:
    name: web (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: web tests, shard ${{ matrix.shard }} of 2
        working-directory: web
        env:
          SHARD: ${{ matrix.shard }}
        run: bun run test --shard="$SHARD/2"

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: end-to-end smoke (fake harness)
        run: bun run smoke

  # Structural performance budgets (bench/budgets.json): bundle bytes, query
  # plans, git spawns per status call, bytes a finished task streams. All are
  # counts, not timings, so the job is deterministic and required; the
  # timings it prints are for people and never fail it.
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: performance budgets
        run: bun run bench

  # A skipped job counts as passing for a required status, so this runs
  # always() and fails on anything that is not an explicit success.
  test:
    if: always()
    needs: [checks, daemon, web, smoke, bench]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: every part passed
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "results: $RESULTS"
          failed=$(printf '%s' "$RESULTS" | tr -d '[] \n"' | tr ',' '\n' | grep -v '^success$' || true)
          if [ -n "$failed" ]; then
            echo "a required part did not succeed"
            exit 1
          fi

  # Cookie scope, CSP enforcement, and framing refusal are BROWSER policies.
  # The daemon suite cannot exercise any of them and no amount of raw HTTP can,
  # so a review asked for focused browser tests rather than a green source
  # suite (SEC-01/02/04, ENG-10). GitHub's ubuntu image ships Chrome.
  browser-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      # A run that fails keeps the scratch daemon's full log and the page
      # screenshots, so a daemon crash is read from its own output rather
      # than guessed from the browser's symptom. Never retried automatically:
      # a failure here is a finding until its log says otherwise.
      - name: the browser boundary holds in a real browser
        env:
          WISP_BROWSER_LOGS: ${{ runner.temp }}/browser-security/logs
          WISP_BROWSER_SCREENSHOTS: ${{ runner.temp }}/browser-security/screenshots
        run: bun run check:browser-security
      - name: keep the daemon log and screenshots of a failed run
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-security-${{ github.run_attempt }}
          path: ${{ runner.temp }}/browser-security/
          retention-days: 14
          if-no-files-found: warn

  # Supply-chain gates, on every pull request rather than only at release time.
  # A review found that ordinary PR CI had no secret scan and no advisory check
  # at all: both existed only in the release job, which is the last place you
  # want to learn about either (SEC-06/SEC-07, ENG-10).
  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Gitleaks scans history, not a diff: a secret removed in a later
          # commit is still published by the commit that added it.
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - name: every third-party action and container is pinned by digest
        run: bun run scripts/check-workflow-pins.ts
      - name: scan history for secrets
        run: |
          docker run --rm --platform linux/amd64 \
            --mount "type=bind,source=$PWD,target=$PWD,readonly" \
            zricethezav/gitleaks@sha256:cdbb7c955abce02001a9f6c9f602fb195b7fadc1e812065883f695d1eeaba854 git "$PWD" \
            --gitleaks-ignore-path "$PWD/.gitleaksignore" \
            --redact
      - run: bun install --frozen-lockfile
      # Advisories are REPORTED here and enforced on the schedule
      # (dependency-advisories.yml). A disclosure published by a third party
      # today must not fail an unrelated pull request today; the weekly run is
      # what makes it someone's job.
      - name: dependency advisories (reported, not blocking)
        continue-on-error: true
        run: bun audit
