# Native core for the Wisp desktop shell (Apple Silicon macOS alpha).
#
# Dependency choices that a reader will otherwise have to re-derive:
#
# * `reqwest` 0.12 with `rustls-tls-native-roots` and `tokio-tungstenite` 0.30
#   with the same feature give REST/SSE and the terminal upgrade ONE TLS stack
#   that trusts the macOS system roots. Certificate verification is never
#   relaxed; there is no `danger_accept_invalid_certs` anywhere in this crate.
# * `security-framework` talks to the macOS Keychain directly. The
#   cross-platform `keyring` crate moved its platform stores behind a separate
#   `keyring-core` registration step in 4.x; this crate only ever targets
#   macOS, so the Apple API is both smaller and more honest about what happens.
# * `getrandom` (not `rand`) supplies the per-launch capability and connection
#   IDs. It is the OS CSPRNG with an API that does not churn between majors.
[package]
name = "wisp-desktop"
version = "0.4.0-alpha.8"
edition = "2021"
rust-version = "1.82"
description = "Native core for the Wisp desktop shell"
license = "MIT"
publish = false

[lib]
name = "wisp_desktop"
path = "src/lib.rs"

[[bin]]
name = "wisp-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
axum = { version = "0.8", features = ["ws"] }
bytes = "1"
futures-util = "0.3"
getrandom = "0.4"
http = "1"
percent-encoding = "2"
reqwest = { version = "0.12", default-features = false, features = [
  "charset",
  "http2",
  "json",
  "rustls-tls-native-roots",
  "stream",
] }
security-framework = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
thiserror = "2"
tokio = { version = "1", features = [
  "io-util",
  "macros",
  "net",
  "rt-multi-thread",
  "sync",
  "time",
] }
tokio-tungstenite = { version = "0.30", default-features = false, features = [
  "connect",
  "handshake",
  "rustls-tls-native-roots",
] }
url = "2"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["full"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
