[package]
name = "wisp-update-verifier"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "Minimal independent verifier for Wisp updater archives"
license = "MIT"
publish = false

[[bin]]
name = "verify-update-signature"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
minisign-verify = "0.2.5"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
